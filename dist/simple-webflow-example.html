<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD25 Website - Simple Webflow Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        #scene-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }

        .controls button {
            background: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 2px;
            border-radius: 3px;
            cursor: pointer;
        }

        .controls button:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <!-- Loading indicator -->
    <div class="loading" id="loading">
        <div>Loading Creative Directors Experience...</div>
        <div style="font-size: 12px; margin-top: 10px; opacity: 0.7;">This may take a few seconds</div>
    </div>

    <!-- Scene container -->
    <div id="scene-container"></div>

    <!-- Optional controls -->
    <div class="controls">
        <button onclick="window.CreativeDirectors?.toggleAnimation?.()">Toggle Animation</button>
        <button onclick="window.CreativeDirectors?.resetScene?.()">Reset Scene</button>
    </div>

    <!-- Load the single JavaScript bundle -->
    <script src="creative-directors.DPFmUmE6.js"></script>

    <script>
        // Simple initialization
        document.addEventListener('DOMContentLoaded', function () {
            console.log('CD25 Website loaded successfully!');

            // Hide loading after 3 seconds
            setTimeout(() => {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.style.display = 'none';
                }
            }, 3000);
        });

        // Check if CreativeDirectors is available
        window.addEventListener('load', function () {
            if (window.CreativeDirectors) {
                console.log('✅ CreativeDirectors library loaded:', window.CreativeDirectors);
            } else {
                console.warn('⚠️ CreativeDirectors library not found');
            }
        });
    </script>
</body>

</html>
